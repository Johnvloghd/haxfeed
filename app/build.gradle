plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meuhaxball'
    compileSdk 34

    defaultConfig {
        applicationId "com.meuhaxball"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
